<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR-juliste – Kipinän Basket</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #e9e7e2; color: #0b0b0b; }
    .bar { max-width: 210mm; margin: 16px auto; display: flex; gap: 8px; padding: 0 16px; }
    .bar button { font: inherit; font-weight: 600; padding: .6rem 1rem; border-radius: 10px; border: 0; background: #c2410c; color: #fff; cursor: pointer; }
    .poster { width: 210mm; min-height: 297mm; margin: 0 auto 32px; background: #fff; padding: 22mm 18mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #c2410c; font-size: 16pt; }
    h1 { font-size: 40pt; line-height: 1.05; margin: 10mm 0 4mm; }
    .sub { font-size: 16pt; color: #333; margin: 0; }
    .match { margin-top: 6mm; font-size: 14pt; color: #52514e; }
    .qr { margin: 12mm 0 8mm; width: 120mm; height: 120mm; border: 3mm solid #c2410c; border-radius: 8mm; padding: 4mm; }
    .qr img { width: 100%; height: 100%; display: block; }
    .steps { font-size: 14pt; color: #333; }
    .url { margin-top: auto; font-family: ui-monospace, monospace; font-size: 11pt; color: #52514e; }
    @media print { body { background: #fff; } .bar { display: none; } .poster { margin: 0; } }
    @media (max-width: 220mm) { .poster { width: 100%; min-height: auto; } .qr { width: min(120mm, 80vw); height: min(120mm, 80vw); } }
  </style>
</head>
<body>
  <div class="bar"><button onclick="print()">Tulosta</button></div>
  <div class="poster">
    <div class="brand">✦ Kipinän Basket</div>
    <h1>Miten onnistuimme tänään?</h1>
    <p class="sub">Kerro mielipiteesi ottelusta – vie alle minuutin.</p>
    <div class="match" id="match"></div>
    <div class="qr"><img id="qr" alt="QR-koodi palautekyselyyn"></div>
    <div class="steps">Avaa puhelimen kamera ja osoita QR-koodia.<br>Kiitos, että teet Kipinän otteluista entistä parempia!</div>
    <div class="url" id="url"></div>
  </div>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const r = await fetch(`/api/events/${encodeURIComponent(id)}`);
  if (r.status === 401) return (location.href = `/admin/login?next=${encodeURIComponent(location.pathname + location.search)}`);
  const { event } = await r.json();
  document.getElementById('qr').src = `/api/events/${event.id}/qr.svg`;
  const d = new Date(event.date.length === 10 ? event.date + 'T12:00' : event.date);
  document.getElementById('match').textContent = `Kipinä – ${event.opponent} · ${d.toLocaleDateString('fi-FI')}`;
  document.getElementById('url').textContent = event.url;
})();
</script>
</body>
</html>
